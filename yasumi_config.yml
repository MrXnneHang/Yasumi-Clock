  presets:
    custom:
      name: "自定义模式"
      description: |
        <b>DIY模式 (我的节奏我做主):</b><br>这里你说了算！<br>想工作多久、休息多久，都由你来定。像搭积木一样，组合出最适合你自己的节奏吧！
      work_mins: 25
      short_break_mins: 5
      long_break_mins: 15
      cycles_before_long_break: 4
      help_texts:
        work_duration: |
          <b>工作时长 (分钟)</b><hr>
          <b>这是你一次专注投入的时间。</b><br>
          经典番茄钟是25分钟，但你可以根据自己的节奏调整。刚开始可以短一点，让自己更容易进入状态。<br><br>
          <b>意外处理：</b>如果中途被打断，可以暂停计时器。如果打断时间很长或思绪已乱，建议作废此轮，休息后重新开始。
        short_break: |
          <b>短休息时长 (分钟)</b><hr>
          <b>每次专注结束后的小憩。</b><br>
          建议5分钟左右。站起来，伸个懒腰，看看窗外，让大脑和眼睛真正地放松一下。<br><br>
          <b>意外处理：</b>短休息很容易超时。建议远离手机等干扰源。如果不小心超时了，也别太自责，尽快回到专注状态就好。
        long_break: |
          <b>长休息时长 (分钟)</b><hr>
          <b>连续完成几个专注循环后的奖励！</b><br>
          通常是15-30分钟。你可以利用这段时间做一些完全不同的事情，比如听歌、看视频或聊天。<br><br>
          <b>意外处理：</b>长休息的目的是恢复精力。如果休息后感觉更累（比如玩游戏太投入），说明休息方式可能不对，下次试试别的。
        cycles_before_long_break: |
          <b>长休息间隔 (循环次数)</b><hr>
          <b>决定了你要完成多少轮“专注-短休息”才能获得一次长休息。</b><br>
          经典设置是4次。如果任务很耗神，可以设置成2或3次。<br><br>
          <b>意外处理：</b>如果还没到次数就感觉非常疲惫，不要硬撑！可以提前进入长休息，灵活调整比死守规则更重要。
    student:
      name: "学生模式 (45/10, 3轮/长休30)"
      description: |
        <b>学霸模式 (上课啦):</b><br>模拟真实的课堂时间。<br>专注学习45分钟，就像上一节课；然后休息10分钟，放松一下大脑。<br><br>每“上”完 <b>3</b> 节课，还能享受一个 <b>30</b> 分钟的“大课间”！
      work_mins: 45
      short_break_mins: 10
      long_break_mins: 30
      cycles_before_long_break: 3
    professional:
      name: "专注工作 (25/5, 4轮/长休15)"
      description: |
        <b>高效工作 (番茄钟):</b><br>这是超经典的“番茄工作法”。<br>像吃番茄一样，把大任务分成小块。专注冲刺25分钟，然后短暂休息5分钟。<br><br>每完成 <b>4</b> 个“小番茄”，就能获得一个 <b>15</b> 分钟的“大奖励”！
      work_mins: 25
      short_break_mins: 5
      long_break_mins: 15
      cycles_before_long_break: 4
    fragmented_time:
      name: "碎片时间 (15/3, 4轮/长休10)"
      description: |
        <b>时间魔法 (挤牙膏):</b><br>让每一分钟都发光！<br>只有一点点时间？没问题！用15分钟快速搞定一件事，再用3分钟喘口气。积少成多，你会惊讶于自己的效率！<br><br>每完成 <b>4</b> 个小任务，还能休息 <b>10</b> 分钟哦。
      work_mins: 15
      short_break_mins: 3
      long_break_mins: 10
      cycles_before_long_break: 4